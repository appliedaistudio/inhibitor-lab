name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "philly_pulse/**"
      - "radiotranscriber.py"
      - "multi_transcriber.py"
      - "config.yaml"
      - "requirements-philly-pulse.txt"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: /root/deploy.sh
