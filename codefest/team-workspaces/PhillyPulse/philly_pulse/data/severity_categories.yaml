# Severity base scores per LLM-extracted category.
# S_base is on [0, 1]. Higher = more severe = hotter pin on map.
# The LLM must output one of these category keys exactly.

categories:
  violent_weapon:
    s_base: 1.0
    description: "Assault, shooting, stabbing, or any incident involving a weapon"
  violent_no_weapon:
    s_base: 0.85
    description: "Assault or fight without a weapon"
  shots_heard:
    s_base: 0.90
    description: "Shots fired / heard, no confirmed victim"
  robbery:
    s_base: 0.80
    description: "Robbery in progress or just occurred"
  burglary_in_progress:
    s_base: 0.65
    description: "Burglary or breaking and entering, in progress"
  medical_priority:
    s_base: 0.60
    description: "Priority medical emergency (cardiac arrest, overdose, etc.)"
  medical_other:
    s_base: 0.35
    description: "Non-priority medical call"
  fire_hazmat:
    s_base: 0.75
    description: "Structure fire, vehicle fire, or hazmat incident"
  traffic_crash_injury:
    s_base: 0.55
    description: "Traffic crash with injuries"
  traffic_crash_no_injury:
    s_base: 0.30
    description: "Traffic crash, no injuries reported"
  disorder:
    s_base: 0.40
    description: "Disturbance, disorderly conduct, noise complaint with police response"
  admin_or_noise:
    s_base: 0.0
    description: "Administrative traffic, test tones, non-dispatch chatter (usually filtered out)"
